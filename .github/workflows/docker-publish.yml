name: Build and publish Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag, latest or same as npm build"
        required: true
        default: "latest"
        type: string

      build_tag:
        description: "Dist version, set this to the version being built in npm, e.g v1.0.0"
        required: false
        default: "v1.0.0"
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}
          build-args: |
            TAG=${{ inputs.build_tag }}